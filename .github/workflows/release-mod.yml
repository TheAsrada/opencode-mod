name: release-mod
run-name: "mod desktop release ${{ github.ref_name }}"

# Modified OpenCode Desktop distribution.
# - Triggers on tags like desktop-mod-v0.1.0 (independent mod versioning)
#   or manually via workflow_dispatch.
# - Builds unsigned installers with OPENCODE_CHANNEL=dev (separate app id
#   ai.opencode.desktop.dev, no Apple/Azure signing, no notarization).
# - Upstream publish.yml is guarded to anomalyco/opencode and never runs here.

on:
  push:
    tags:
      - "desktop-mod-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version override for manual runs (e.g. 0.1.0, without leading v)"
        required: false
        type: string
      attach_run_id:
        description: "Attach already-built artifacts from this run id to attach_tag (skips builds)"
        required: false
        type: string
      attach_tag:
        description: "Existing release tag to attach artifacts to (e.g. desktop-mod-v0.1.4)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-desktop:
    if: ${{ inputs.attach_tag == '' }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: windows-2025
            target: x86_64-pc-windows-msvc
            platform_flag: --win
          # windows-11-arm dropped: bun install patch step flakes on that
          # runner (ENOTEMPTY cache race) and upstream doesn't support ARM
          # MSVC builds either. Revisit if GitHub runner stabilizes.
          - host: macos-latest
            target: aarch64-apple-darwin
            platform_flag: --mac --arm64
            bun_install_flags: --os=darwin --cpu=arm64
          - host: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform_flag: --linux
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform_flag: --linux --arm64
    runs-on: ${{ matrix.settings.host }}
    env:
      OPENCODE_CHANNEL: dev
      RUST_TARGET: ${{ matrix.settings.target }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun
        with:
          install-flags: ${{ matrix.settings.bun_install_flags }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies (ubuntu only)
        if: contains(matrix.settings.host, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm

      - name: Resolve mod version
        id: modver
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/desktop-mod-v* ]]; then
            VER="${GITHUB_REF_NAME#desktop-mod-v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VER="${{ inputs.version }}"
          else
            VER="0.0.0-dev.${GITHUB_SHA::7}"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Mod version: $VER"

      - name: Prepare
        run: bun ./scripts/prepare.ts
        working-directory: packages/desktop
        env:
          OPENCODE_VERSION: ${{ steps.modver.outputs.version }}

      - name: Build
        run: bun run build
        working-directory: packages/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          OPENCODE_VERSION: ${{ steps.modver.outputs.version }}

      - name: Package (unsigned)
        run: npx electron-builder ${{ matrix.settings.platform_flag }} --publish never --config electron-builder.config.mod.ts
        working-directory: packages/desktop
        timeout-minutes: 60

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: opencode-mod-desktop-${{ matrix.settings.target }}
          path: packages/desktop/dist/*
          if-no-files-found: error

  release:
    needs: build-desktop
    if: startsWith(github.ref, 'refs/tags/desktop-mod-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          pattern: opencode-mod-desktop-*
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf dist/*-unpacked dist/mac-arm64
          cat > /tmp/mod-notes.md <<'EOF'
          # OpenCode Mod ${{ github.ref_name }}

          Modified OpenCode Desktop distribution (unsigned, `dev` channel app id).

          ## Mod features
          - **Persistent window zoom** — desktop remembers webview zoom across restarts, menu/pinch/IPC actions stay in sync with the renderer.
          - **`/btw` side-question command** (Claude Code parity) — ask a quick question answered from conversation context only, via a hidden no-tools subagent, without polluting main history. Dismissible overlay in TUI/Desktop.

          ## Installers
          - Windows x64: `*-win-x64.exe` (NSIS, unsigned — SmartScreen will warn, choose "Run anyway")
          - macOS arm64: `*.dmg` (unsigned — right-click → Open on first launch)
          - Linux x64/arm64: `*.AppImage`, `*.deb`, `*.rpm`

          Base: anomalyco/opencode dev branch (see README for exact base commit).
          EOF
          gh release create "${{ github.ref_name }}" --title "OpenCode Mod ${{ github.ref_name }}" --notes-file /tmp/mod-notes.md dist/*

  attach:
    if: ${{ inputs.attach_tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download already-built artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "${{ inputs.attach_run_id }}" --repo "${{ github.repository }}" --dir dist

      - name: Upload installers to existing release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf dist/*/*-unpacked dist/*/mac-arm64
          if gh release view "${{ inputs.attach_tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${{ inputs.attach_tag }}" --repo "${{ github.repository }}" --clobber dist/*/*
          else
            gh release create "${{ inputs.attach_tag }}" --repo "${{ github.repository }}" --title "OpenCode Mod ${{ inputs.attach_tag }}" --notes "Modified OpenCode Desktop distribution (unsigned, dev channel app id). See README for mod features and install notes." dist/*/*
          fi
